# INOCULENS Tunnel — Netlify configuration (frontend + backend, no Firebase).
# - Static site served from repo root.
# - Backend: Netlify Functions in netlify/functions/ with Netlify Blobs
#   storage (see package.json). No firebase.json/.firebaserc needed or present.
#
# INOCULENS Tunnel — Cloudflare for SaaS (INOCULENS account) + Netlify.
# - Static site + API served from this ONE Netlify site (Blobs storage).
# - Custom-domain TLS is terminated by Cloudflare for SaaS on zone inoculens.com:
#     SaaS CNAME target (proxied): customers.inoculens.com
#       -> proxy-fallback.inoculens.com (fallback origin, active)
#       -> Worker tunnel-custom-host (*/* route) -> https://s.inoculens.com/<code>
#   Customers: CNAME <custom> -> customers.inoculens.com
#              TXT verification.<custom> -> <token> (ownership)
#   Certificates use HTTP validation (automatic, no _acme-challenge record).
#
# DOMAINS on this Netlify site (Site settings → Domains, DNS-only in Cloudflare):
#   App:         tunnel.inoculens.com -> inoculens-tunnel.netlify.app (DNS only)
#   Short links: s.inoculens.com      -> inoculens-tunnel.netlify.app (DNS only)
#   DO NOT proxy s/tunnel through Cloudflare (orange cloud OFF) — they serve
#   Netlify directly. Only customers.* + proxy-fallback are proxied (SaaS).
#   Routing is handled by netlify/edge-functions/short-domain.js:
#     s.<any>/ or <custom>/            → 301 to https://tunnel.inoculens.com/
#     s.<any>/<code>, <custom>/<code>  → resolve function (redirect + clicks)
# - Required env vars (Site settings → Environment variables):
#     SITE_URL=s.inoculens.com                     (system short-link host)
#     ROUTING_TARGET=customers.inoculens.com       (SaaS CNAME target customers point at)
#     CLOUDFLARE_API_TOKEN=<token with SaaS Edit + Zone Read>
#     CLOUDFLARE_ZONE_ID=f5257b10f944cb85e5418ab82f4be6ef  (inoculens.com)
#     DCV_DELEGATION_UUID=adad0549ffb44d06         (zone DCV delegation suffix)
#     DOMAIN_PRICE_USD=10  QUOTE_TTL_DAYS=7        (billing defaults)
#     DISCOUNT_CODES={"WELCOME10":10}               (optional promo codes)
#     BTC_USD_FALLBACK=65000                        (used if CoinGecko is unreachable)
#     BTC_XPUB=xpub…  (+ npm i bitcoinjs-lib bip32 tiny-secp256k1)
#        enables real payment addresses; without it generatePaymentAddress
#        returns a clear "not configured" error. MANUAL_BTC_ADDRESS is for
#        local testing only (single reused address — never production).
#     HOME_URL=https://tunnel.inoculens.com/      (resolver fallback/404 base)
#     AUTO_SSL=1 (default) — with Cloudflare SaaS HTTP validation, routing
#       validity implies SSL will auto-provision. Set SSL_DELEGATION_TARGET
#       only if you switch a hostname to TXT/delegated validation.

[build]
  publish = "."
  # No build step: plain HTML/CSS/JS. `npm run build` intentionally absent.

# Clean URLs: /about serves about.html etc. (Netlify Pretty URLs also do
# this by default; explicit rules keep it working if that setting changes).
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Everything else that isn't a file → branded 404 page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security + caching headers. CSP mirrors the <meta> tags in the HTML
# (headers win where both exist; keep them in sync when editing).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com; img-src 'self' data: https:; media-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';"
    # HSTS: enable ONLY once serving exclusively over HTTPS with no
    # HTTP-only subdomains. Uncomment after verifying:
    # Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/visuals/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
